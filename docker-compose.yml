services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: peerbridge:latest
    container_name: peerbridge
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    # Bound to localhost only: Nginx on the host terminates TLS and
    # reverse-proxies here (see deploy/nginx/transfer.ashwanitiwari.com.conf).
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
