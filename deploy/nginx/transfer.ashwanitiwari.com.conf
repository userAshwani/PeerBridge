# /etc/nginx/sites-available/transfer.ashwanitiwari.com
#
# Reverse proxy for PeerBridge (Next.js + /ws signaling on one Node
# process, listening on 127.0.0.1:3000 — see docker-compose.yml).
#
# Install:
#   sudo cp deploy/nginx/transfer.ashwanitiwari.com.conf \
#       /etc/nginx/sites-available/transfer.ashwanitiwari.com
#   sudo ln -s /etc/nginx/sites-available/transfer.ashwanitiwari.com \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d transfer.ashwanitiwari.com
#
# `certbot --nginx` will rewrite the server blocks below in place to add
# `listen 443 ssl;`, `ssl_certificate`/`ssl_certificate_key`, and an
# HTTP->HTTPS redirect — the ssl_* directives here are what it will
# produce, kept inline so this file is correct even before certbot runs
# a second time on renewal.

upstream peerbridge_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Only send "Connection: upgrade" on actual WebSocket upgrade requests;
# regular HTTP requests get "Connection: close" so keepalive isn't broken.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name transfer.ashwanitiwari.com;

    # Required for certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transfer.ashwanitiwari.com;

    ssl_certificate     /etc/letsencrypt/live/transfer.ashwanitiwari.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transfer.ashwanitiwari.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # Large multi-GB transfers happen over the WebRTC data channel directly
    # between browsers, not through this proxy — but keep body size generous
    # for any future HTTP endpoints, and raise timeouts for long-lived
    # signaling WebSocket connections.
    client_max_body_size 20m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://peerbridge_app;
        proxy_http_version 1.1;

        # WebSocket upgrade (required for the /ws signaling endpoint).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
